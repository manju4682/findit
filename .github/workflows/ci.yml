name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Go binary embeds frontend/dist, so it must exist before `go build`.
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install The Sleuth Kit
        run: brew install sleuthkit

      - name: Generate test fixtures
        run: |
          scripts/make_fixture.sh && scripts/make_fs_fixture.sh \
            || echo "::warning::fixture generation failed; fixture-based tests will be skipped"

      - name: Vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
